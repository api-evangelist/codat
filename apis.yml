- aid: codat:sync-for-payables-api
  name: Codat Bill Pay API
  description: >-
    The Codat Bill Pay API (Sync for Payables) enables neobanks, expense management providers, and B2B
    payment platforms to automate customers' accounts payable workflows, providing a standardized data
    model to sync bills and bill payments with all major accounting software in real time.
