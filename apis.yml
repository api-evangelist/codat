- aid: codat:spend-insights-api
  name: Codat Spend Insights API
  description: >-
    The Codat Spend Insights API enables banks and commercial card issuers to access clients' accounts
    payable data from their ERP or accounting software within minutes, providing insights on spend and
    supplier activity to identify suppliers eligible for virtual card programs and grow commercial card
    volume in B2B payments.
