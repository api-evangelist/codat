- aid: codat:sync-for-commerce-api
  name: Codat Sync for Commerce API
  description: >-
    The Codat Sync for Commerce API automatically replicates and reconciles sales data from merchant point-of-sale,
    payments, and eCommerce systems into their accounting software, transforming raw sales and payments
    data into detailed sales invoices for automated accounting reconciliation.
  humanURL: https://docs.codat.io/commerce/overview
