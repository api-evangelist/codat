- aid: codat:sync-for-expenses-api
  name: Codat Sync for Expenses API
  description: >-
    The Codat Sync for Expenses API enables corporate card and expense management platforms to provide
    high-quality integrations with multiple accounting platforms, synchronizing categorized expense data
    including receipts, general ledger mappings, and tracking categories into SMB accounting software
    through a standardized data model.
  humanURL: https://docs.codat.io/expenses/overview
