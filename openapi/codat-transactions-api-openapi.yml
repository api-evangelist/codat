    BankTransactions:
      title: Bank transactions
      type: array
      maxItems: 1000
      items:
        title: Bank transaction
        type: object
        properties:
          id:
            type: string
            description: Identifier for the bank account transaction, unique for the company in the accounting software.
            example: '716422529'
          date:
            title: Local date time
            type: string
            examples:
            - '2023-08-22T10:21:00'
            - '2023-08-22'
            description: 'In Codat''s data model, dates and times are represented using the <a class="external" href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO 8601 standard</a>. Date and time fields are formatted as strings; for example:


              ```

              2023-08-22T10:21:00

              2023-08-22

              ```


              When pushing bank transaction data to Codat, the date is treated as a local date. This means:


              - The date/time is used exactly as provided, without any timezone conversion.

              - If a timezone offset is included (e.g., `2023-08-22T10:21:00-05:00`), the offset will be ignored and only the local date/time portion will be used.

              - We recommend providing dates without a timezone suffix for clarity (e.g., `2023-08-22T10:21:00` rather than `2023-08-22T10:21:00Z`).'
          description:
            type: string
            nullable: true
            description: Description of the bank transaction.
            example: Debit for Payment Id sdp-1-57379a43-c4b8-49f5-bd7c-699189ee7a60
          counterparty:
            type: string
            nullable: true
            description: The giving or receiving party such as a person or organization.
            example: ACME INC
          reference:
            type: string
            nullable: true
            description: An optional reference to the bank transaction.
            example: reference for transaction
          reconciled:
            type: boolean
            nullable: true
            description: '`True` if the bank transaction has been [reconciled](https://www.xero.com/uk/guides/what-is-bank-reconciliation/) in the accounting software.'
            example: false
          amount:
            type: number
            format: decimal
            description: The amount transacted in the bank transaction.
            example: 999.99
          balance:
            type: number
            format: decimal
            description: The remaining balance in the account with ID `accountId`. This field is optional for QuickBooks Online but is required for Xero, Sage, NetSuite, Exact, and FreeAgent.
            example: -999.99
          transactionType:
            title: Bank transaction type
            nullable: true
            description: Type of transaction for the bank statement line.
            type: string
            enum:
            - Unknown
            - Credit
            - Debit
            - Int
            - Div
            - Fee
            - SerChg
            - Dep
            - Atm
            - Pos
            - Xfer
            - Check
            - Payment
            - Cash
            - DirectDep
            - DirectDebit
            - RepeatPmt
            - Other
    DateTime:
      title: Date time
      type: string
      examples:
      - '2022-10-23T00:00:00Z'
      - '2022-10-23'
      description: "In Codat's data model, dates and times are represented using the <a class=\"external\" href=\"https://en.wikipedia.org/wiki/ISO_8601\" target=\"_blank\">ISO 8601 standard</a>. Date and time fields are formatted as strings; for example:\n\n```\n2020-10-08T22:40:50Z\n2021-01-01T00:00:00\n```\n\n\n\nWhen syncing data that contains `DateTime` fields from Codat, make sure you support the following cases when reading time information:\n\n- Coordinated Universal Time (UTC): `2021-11-15T06:00:00Z`\n- Unqualified local time: `2021-11-15T01:00:00`\n- UTC time offsets: `2021-11-15T01:00:00-05:00`\n\n> Time zones\n> \n> Not all dates from Codat will contain information about time zones.  \n> Where it is not available from the underlying platform, Codat will return these as times local to the business whose data has been synced."
