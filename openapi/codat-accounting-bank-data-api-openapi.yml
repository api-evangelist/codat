      definitions:
        bankTransactionType:
          title: Bank transaction type
          description: Type of transaction for the bank statement line.
          type: string
          enum:
          - Unknown
          - Credit
          - Debit
          - Int
          - Div
          - Fee
          - SerChg
          - Dep
          - Atm
          - Pos
          - Xfer
          - Check
          - Payment
          - Cash
          - DirectDep
          - DirectDebit
          - RepeatPmt
          - Other
