          accountId:
            type: string
            nullable: true
            description: Unique identifier to the `accountId` the bank transactions originates from.
          clearedOnDate:
            $ref: '#/components/schemas/DateTime'
          description:
            type: string
            nullable: true
            description: Description of the bank transaction.
          reconciled:
            type: boolean
