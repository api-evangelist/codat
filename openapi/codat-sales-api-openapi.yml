components:
  schemas:
    CommerceProducts:
      title: 'Commerce: Products'
      x-internal: true
      allOf:
      - type: object
        properties:
          results:
            type: array
            items:
              $ref: '#/components/schemas/CommerceProduct'
      - $ref: '#/components/schemas/PagingInfo'
    CommerceDispute:
      title: 'Commerce: Dispute'
      description: "A customer may file a payment dispute with their bank or other card issuer when they're unsatisfied with their purchase or believe they have been charged incorrectly. For example:  \n- They didn't receive an order.  \n- The product they received was different to the commerce store's description.  \n- They've been the victim of online fraud.  \n\nYou can use data from the Disputes endpoints to calculate key metrics, such as the number of chargebacks."
      type: object
      allOf:
      - $ref: '#/components/schemas/CommerceOrder/allOf/0'
      - type: object
        required:
        - currency
        properties:
          disputedTransactions:
            description: Link to the source event(s) which triggered this transaction.
            type: array
            items:
              $ref: '#/components/schemas/CommerceTransaction/definitions/transactionSourceRef'
          totalAmount:
            description: Total transaction amount that is under dispute.
            format: decimal
            examples:
            - 194.12
            - -283.56
            - 0
          currency:
            description: Currency of the disputed transaction.
            $ref: '#/components/schemas/SourceAccount/properties/currency'
          status:
            $ref: '#/components/schemas/CommerceDispute/definitions/disputeStatus'
          reason:
            description: Reason for the dispute
            type: string
            examples:
            - Unhappy with product
          dueDate:
            description: Date when the next action in the dispute resolution is due
            $ref: '#/components/schemas/DateTime'
      - $ref: '#/components/schemas/CommerceOrder/allOf/2'
      - $ref: '#/components/schemas/CommerceOrder/allOf/3'
      definitions:
        disputeStatus:
          description: Current status of the dispute
          x-internal: true
          type: string
          enum:
          - Won
          - Lost
          - Accepted
          - Processing
          - ChargeRefunded
          - EvidenceRequired
          - InquiryEvidenceRequired
          - InquiryProcessing
          - InquiryClosed
          - WaitingThirdParty
          - Unknown
          example: EvidenceRequired
      examples:
      - id: 03e608e3-bd1c-454f-8c2b-fb0133e43b95
        disputedTransactions:
        - id: e63ad857-7e12-4e64-9185-cdfd7c45d09d
          type: Order
        totalAmount: -47.66
        currency: GBP
        status: InquiryEvidenceRequired
        reason: Unhappy with product
        dueDate: '2021-03-29T14:39:55'
        createdDate: '2021-03-22T14:39:55'
        modifiedDate: '2022-02-02T11:02:45Z'
        sourceModifiedDate: '2021-03-22T14:39:55'
    CommerceReport:
      title: Commerce report
      description: "## Structure\n\nAssess reports follow a consistent structure. Reports contain four sections of information:\n\n### 1. Report definition\n\nInformation such as:\n\n  1. The report info (e.g. enhanced_profit_and_loss).\n  2. The display name of the report (e.g. Enhanced Profit and Loss).\n  \n### 2. Dimension info\n\nInformation about the dimension contained in the reports such as:\n\n  1. The type of dimension (e.g. datetime, recordRef).\n  2. The display name of the dimension (e.g. Period, Category type, Category sub type).\n  3. The details about each item within the dimension (e.g. displayName:\"Jan 2022\", start:\"...\", end:\"...\", id:\"...\", name:\"...\").\n\n### 3. Measure info\n\nInformation about the measures contained in the report such as:\n\n  1. The display name of the measure (e.g. value of account, percentage change).\n  2. The type of the measure (e.g. currency, percentage).\n  3. The unit of the measure (e.g. %, GBP).\n  \n### 4. The data for the report\n\nWhen the *includeDisplayName* parameter is set to *true*, it shows the *dimensionDisplayName* and *itemDisplayName* to make the data human-readable. The default setting for *includeDisplayName* is *false*.\n\n\n## Displaying the report\n\nReports can be rendered as follows (ordering is implicit rather than explicit):\n\n![A table showing an example of how a report can be rendered](https://files.readme.io/1fa20ca-Report1.png)\n\n# Data model\n\n## Dimensions"
      type: object
      properties:
        reportInfo:
          type: object
          additionalProperties:
            type: string
        dimensions:
          type: array
          items:
            $ref: '#/components/schemas/CommerceReport/definitions/commerceReportDimension'
        measures:
          type: array
          items:
            $ref: '#/components/schemas/CommerceReport/definitions/commerceReportMeasure'
        reportData:
          type: array
          items:
            $ref: '#/components/schemas/CommerceReport/definitions/commerceReportComponent'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/CommerceReport/definitions/commerceReportError'
      definitions:
        commerceReportMeasure:
          title: Measure
          type: object
          properties:
            displayName:
              description: The measure's display name.
              type: string
            units:
              type: string
              description: The measure's units e.g. percentage (%).
            index:
              type: integer
              description: The measure's index.
            type:
              type: string
              description: The measure's type.
        commerceReportError:
          title: Error
          type: object
          properties:
            message:
              type: string
              description: Message returned by error.
            type:
              type: string
              description: The type of error.
            details:
              description: Additional details on the error.
              type: object
