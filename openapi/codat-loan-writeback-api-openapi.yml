      operationId: get-create-directCosts-model
      x-speakeasy-group: loan-writeback.direct-costs
      description: 'The *Get create direct cost model* endpoint returns the expected data for the request payload when creating a [direct cost](https://docs.codat.io/lending-api#/schemas/DirectCost) for a given company and integration.


        [Direct costs](https://docs.codat.io/lending-api#/schemas/DirectCost) are business expenses that don''t impact Accounts Payable.


        **Integration-specific behavior**


        See the *response examples* for integration-specific indicative models.

        '
