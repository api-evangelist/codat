      operationId: get-create-payment-model
      x-speakeasy-group: loan-writeback.payments
      description: 'The *Get create payment model* endpoint returns the expected data for the request payload when creating a [payment](https://docs.codat.io/lending-api#/schemas/Payment) for a given company and integration.


        [Payments](https://docs.codat.io/lending-api#/schemas/Payment) represent an allocation of money within any customer accounts receivable account.


        **Integration-specific behavior**


        See the *response examples* for integration-specific indicative models.'
  /companies/{companyId}/connections/{connectionId}/push/payments:
    parameters:
    - $ref: '#/components/parameters/companyId'
    - $ref: '#/components/parameters/connectionId'
    post:
      tags:
      - Loan writeback
      summary: Create payment
      parameters:
      - $ref: '#/components/parameters/timeoutInMinutes'
      - $ref: '#/components/parameters/allowSyncOnPushComplete'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountingPayment'
            examples:
              QuickBooks Desktop:
                value:
                  customerRef:
                    id: 80000002-1674552702
                    companyName: string
                  accountRef:
                    id: 8000002E-1675267199
                    name: Undeposited Funds
                  paymentMethodRef:
                    id: string
                    name: string
                  totalAmount: 28
                  currency: USD
                  currencyRate: 1
                  date: '2023-02-10T11:47:04.792Z'
                  note: note 14/02 1147
                  lines:
                  - amount: 28
                    links:
                    - type: Invoice
                      id: 181-1676374586
                      amount: -28
                      currencyRate: 1
                    allocatedOnDate: '2023-02-11T11:47:04.792Z'
                  reference: ref 14/02 1147
              Sage 50 (UK):
                value:
                  customerRef:
                    id: CUST1
                  accountRef:
                    id: '1200'
                    name: Bank Current Account
                  paymentMethodRef:
                    id: '4405'
                  totalAmount: 4
                  currency: GBP
                  currencyRate: 1
                  date: '2023-03-17T11:47:04.792Z'
                  note: note 07/03 14.31
                  lines:
                  - amount: 4
                    links:
                    - type: Invoice
                      id: INV-31
                      amount: -4
                      currencyRate: 1
                    allocatedOnDate: '2023-02-11T11:47:04.792Z'
                  reference: ref
              Sage Business Cloud Accounting:
                value:
                  customerRef:
                    id: 30444c5bd4964fd787c7f8e2e5301ce1
                    companyName: Stanley test customer
                  accountRef:
                    id: 9a25937b267a11e797950a57719b2edb
                    name: Current
                  totalAmount: 0.17
                  currency: GBP
                  currencyRate: 1
                  date: '2023-03-20T11:47:04.792Z'
                  note: Need to send products asap.
                  lines:
                  - amount: 0.17
                    links:
                    - type: Invoice
                      id: bb85db9226d7450fb99eb83e7fb37505
                      amount: -0.17
                      currencyRate: 1
                    allocatedOnDate: '2023-02-11T11:47:04.792Z'
                  reference: normal payment 20/03 17.05
              Sage Intacct:
                value:
                  customerRef:
                    id: '19'
                  accountRef:
                    id: '81'
                  date: '2022-03-12T00:00:00'
                  totalAmount: 0
                  lines:
                  - amount: 0
                    links:
                    - id: '246'
                      type: Invoice
                      amount: -1.1
                    - id: '280'
                      type: CreditNote
                      amount: 1.1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountingCreatePaymentResponse'
