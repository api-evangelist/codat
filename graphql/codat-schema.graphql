"""
Codat GraphQL Schema
Codat is a unified API platform providing standardized access to SMB financial data
from 30+ accounting, banking, commerce, and ERP systems.
Source: https://docs.codat.io/reference/
"""

# ─────────────────────────────────────────────
# Scalars
# ─────────────────────────────────────────────

scalar DateTime
scalar Date
scalar Decimal
scalar JSON

# ─────────────────────────────────────────────
# Enums
# ─────────────────────────────────────────────

enum ConnectionStatus {
  PendingAuth
  Linked
  Unlinked
  Deauthorized
}

enum DataTypeStatus {
  Unknown
  FetchError
  Processing
  ValidationError
  AuthError
  Complete
  NotSupported
}

enum PullOperationStatus {
  Initial
  Processing
  Complete
  FetchError
  AuthError
  ValidationError
}

enum AccountType {
  Asset
  Liability
  Equity
  Income
  Expense
  Unknown
}

enum BillStatus {
  Open
  PartiallyPaid
  Paid
  Void
  Draft
  Unknown
}

enum InvoiceStatus {
  Draft
  Submitted
  PartiallyPaid
  Paid
  Void
  Unknown
}

enum PaymentStatus {
  Unknown
  Unreconciled
  Reconciled
  Void
}

enum OrderStatus {
  Unknown
  Open
  Closed
  Deleted
}

enum DisputeStatus {
  Won
  Lost
  Accepted
  Processing
  ChargeRefunded
  EvidenceRequired
  InquiryEvidenceRequired
  InquiryProcessing
  InquiryClosedBankWon
  WaitingThirdParty
  Unknown
}

# ─────────────────────────────────────────────
# Platform & Core Types
# ─────────────────────────────────────────────

"""A business entity registered in Codat."""
type Company {
  id: ID!
  name: String!
  description: String
  redirect: String
  lastSync: DateTime
  created: DateTime!
  createdByUserName: String
  connections: [Connection!]!
  dataConnections: [Connection!]!
}

"""A link between a Company and a source platform."""
type Connection {
  id: ID!
  companyId: ID!
  integrationId: ID!
  integrationKey: String!
  sourceId: ID!
  sourceType: String!
  platformName: String!
  status: ConnectionStatus!
  created: DateTime!
  lastSync: DateTime
  dataStatus: [DataStatus!]!
}

"""Represents an asynchronous data pull request."""
type PullOperation {
  id: ID!
  companyId: ID!
  connectionId: ID!
  dataType: String!
  status: PullOperationStatus!
  requested: DateTime!
  completed: DateTime
  progress: Int
  errorMessage: String
}

"""The sync status of a particular data type for a Connection."""
type DataStatus {
  dataType: String!
  lastSuccessfulSync: DateTime
  currentStatus: DataTypeStatus!
  latestSuccessfulSyncId: ID
  latestSyncId: ID
}

"""A dataset (collection of pulled records) for a given data type."""
type Dataset {
  id: ID!
  companyId: ID!
  connectionId: ID!
  dataType: String!
  status: PullOperationStatus!
  requested: DateTime!
  completed: DateTime
}

"""A supported third-party integration platform."""
type Integration {
  id: ID!
  key: String!
  name: String!
  logoUrl: String
  sourceId: ID!
  enabled: Boolean!
  supportedEnvironments: [String!]!
  datatypeFeatures: JSON
}

"""An event notification webhook endpoint."""
type Webhook {
  id: ID!
  companyId: ID
  type: String!
  url: String!
  notifiers: WebhookNotifiers
  createdDate: DateTime
}

type WebhookNotifiers {
  emails: [String!]
  webhook: String
}

"""Configuration settings at company, connection, or platform level."""
type Setting {
  key: String!
  value: String
  description: String
}

# ─────────────────────────────────────────────
# Accounting — Master Data
# ─────────────────────────────────────────────

"""A chart-of-accounts entry representing a general ledger account."""
type AccountingAccount {
  id: ID!
  name: String!
  nominalCode: String
  description: String
  fullyQualifiedCategory: String
  fullyQualifiedName: String
  currency: String
  currentBalance: Decimal
  type: AccountType!
  status: String
  isBankAccount: Boolean
  modifiedDate: DateTime
  sourceModifiedDate: DateTime
  validDatatypeLinks: [ValidDatatypeLink!]
}

type ValidDatatypeLink {
  property: String
  links: [String!]
}

"""A raw transaction record from a bank account in accounting software."""
type AccountTransaction {
  id: ID!
  transactionId: String
  note: String
  bankAccountRef: Reference
  date: DateTime
  status: String
  currency: String
  currencyRate: Decimal
  lines: [AccountTransactionLine!]
  totalAmount: Decimal
  modifiedDate: DateTime
  sourceModifiedDate: DateTime
}

type AccountTransactionLine {
  description: String
  recordRef: Reference
  accountingAccountRef: Reference
  amount: Decimal!
}

# ─────────────────────────────────────────────
# Accounting — Bills & Payables
# ─────────────────────────────────────────────

"""A supplier invoice representing money owed by the company."""
type Bill {
  id: ID!
  reference: String
  supplierRef: Reference
  purchaseOrderRefs: [Reference!]
  issueDate: Date
  dueDate: Date
  currency: String
  currencyRate: Decimal
  lineItems: [BillLineItem!]
  withholdingTax: [WithholdingTax!]
  status: BillStatus!
  subTotal: Decimal
  taxAmount: Decimal
  totalAmount: Decimal
  amountDue: Decimal
  note: String
  paymentAllocations: [PaymentAllocation!]
  modifiedDate: DateTime
  sourceModifiedDate: DateTime
}

type BillLineItem {
  description: String
  unitAmount: Decimal
  quantity: Decimal
  discountAmount: Decimal
  subTotal: Decimal
  taxAmount: Decimal
  totalAmount: Decimal
  accountRef: Reference
  taxRateRef: Reference
  itemRef: Reference
  trackingCategoryRefs: [Reference!]
}

"""A credit issued against a Bill."""
type BillCreditNote {
  id: ID!
  billCreditNoteNumber: String
  supplierRef: Reference
  currency: String
  currencyRate: Decimal
  lineItems: [BillLineItem!]
  status: String
  subTotal: Decimal
  totalDiscount: Decimal
  taxAmount: Decimal
  totalAmount: Decimal
  remainingCredit: Decimal
  issueDate: Date
  allocatedOnDate: Date
  note: String
  paymentAllocations: [PaymentAllocation!]
  modifiedDate: DateTime
  sourceModifiedDate: DateTime
}

"""A payment applied against one or more Bills."""
type BillPayment {
  id: ID!
  supplierRef: Reference
  accountRef: Reference
  currency: String
  currencyRate: Decimal
  date: DateTime
  note: String
  lines: [BillPaymentLine!]
  totalAmount: Decimal
  reference: String
  modifiedDate: DateTime
  sourceModifiedDate: DateTime
}

type BillPaymentLine {
  amount: Decimal!
  links: [BillPaymentLineLink!]
}

type BillPaymentLineLink {
  type: String!
  id: ID
  amount: Decimal
  currencyRate: Decimal
}

"""A purchase order placed with a supplier."""
type PurchaseOrder {
  id: ID!
  purchaseOrderNumber: String
  issueDate: Date
  expectedDeliveryDate: Date
  deliveryDate: Date
  currency: String
  currencyRate: Decimal
  supplierRef: Reference
  shipTo: ShippingAddress
  paymentDueDate: Date
  status: String
  lineItems: [PurchaseOrderLineItem!]
  subTotal: Decimal
  taxAmount: Decimal
  totalAmount: Decimal
  note: String
  modifiedDate: DateTime
  sourceModifiedDate: DateTime
}

type PurchaseOrderLineItem {
  description: String
  unitAmount: Decimal
  quantity: Decimal
  discountAmount: Decimal
  subTotal: Decimal
  taxAmount: Decimal
  totalAmount: Decimal
  accountRef: Reference
  taxRateRef: Reference
  itemRef: Reference
  trackingCategoryRefs: [Reference!]
}

type ShippingAddress {
  type: String
  line1: String
  line2: String
  city: String
  region: String
  country: String
  postalCode: String
}

# ─────────────────────────────────────────────
# Accounting — Invoices & Receivables
# ─────────────────────────────────────────────

"""A sales invoice issued to a customer."""
type Invoice {
  id: ID!
  invoiceNumber: String
  customerRef: Reference
  issueDate: Date
  dueDate: Date
  paidOnDate: Date
  currency: String
  currencyRate: Decimal
  lineItems: [InvoiceLineItem!]!
  withholdingTax: [WithholdingTax!]
  status: InvoiceStatus!
  subTotal: Decimal
  totalDiscount: Decimal
  taxAmount: Decimal
  totalAmount: Decimal
  totalTaxAmount: Decimal
  amountDue: Decimal
  note: String
  discountPercentage: Decimal
  salesOrderRefs: [Reference!]
  paymentAllocations: [PaymentAllocation!]
  modifiedDate: DateTime
  sourceModifiedDate: DateTime
}

"""A line item within an Invoice."""
type InvoiceLineItem {
  description: String
  unitAmount: Decimal
  quantity: Decimal
  discountAmount: Decimal
  discountPercentage: Decimal
  subTotal: Decimal
  taxAmount: Decimal
  totalAmount: Decimal
  accountRef: Reference
  taxRateRef: Reference
  itemRef: Reference
  trackingCategoryRefs: [Reference!]
}

"""A credit document issued to a customer."""
type CreditNote {
  id: ID!
  creditNoteNumber: String
  customerRef: Reference
  currency: String
  currencyRate: Decimal
  lineItems: [InvoiceLineItem!]
  status: String
  subTotal: Decimal
  totalDiscount: Decimal
  taxAmount: Decimal
  totalAmount: Decimal
  remainingCredit: Decimal
  issueDate: Date
  allocatedOnDate: Date
  note: String
  paymentAllocations: [PaymentAllocation!]
  modifiedDate: DateTime
  sourceModifiedDate: DateTime
}

"""A customer payment applied against invoices."""
type Payment {
  id: ID!
  customerRef: Reference
  accountRef: Reference
  currency: String
  currencyRate: Decimal
  date: DateTime
  note: String
  lines: [PaymentLine!]
  totalAmount: Decimal
  reference: String
  status: PaymentStatus
  modifiedDate: DateTime
  sourceModifiedDate: DateTime
}

type PaymentLine {
  amount: Decimal!
  links: [PaymentLineLink!]
}

type PaymentLineLink {
  type: String!
  id: ID
  amount: Decimal
  currencyRate: Decimal
}

"""A sales order representing a customer order before invoicing."""
type SalesOrder {
  id: ID!
  salesOrderNumber: String
  customerRef: Reference
  currency: String
  currencyRate: Decimal
  issueDate: Date
  expectedDeliveryDate: Date
  shipTo: ShippingAddress
  status: String
  lineItems: [SalesOrderLineItem!]
  subTotal: Decimal
  taxAmount: Decimal
  totalAmount: Decimal
  note: String
  modifiedDate: DateTime
  sourceModifiedDate: DateTime
}

type SalesOrderLineItem {
  description: String
  unitAmount: Decimal
  quantity: Decimal
  discountAmount: Decimal
  subTotal: Decimal
  taxAmount: Decimal
  totalAmount: Decimal
  accountRef: Reference
  taxRateRef: Reference
  itemRef: Reference
}

"""A payment reversal, issued to a customer or from a supplier."""
type Refund {
  id: ID!
  date: DateTime
  reference: String
  currency: String
  currencyRate: Decimal
  lines: [RefundLine!]
  note: String
  totalAmount: Decimal
  modifiedDate: DateTime
  sourceModifiedDate: DateTime
}

type RefundLine {
  amount: Decimal!
  description: String
