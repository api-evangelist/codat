  sourceModifiedDate: DateTime
}

# ─────────────────────────────────────────────
# Shared / Supporting Types
# ─────────────────────────────────────────────

"""A reference to a related record."""
type Reference {
  id: ID!
  name: String
}

type Address {
  type: String
  line1: String
  line2: String
  city: String
  region: String
  country: String
  postalCode: String
}

type Contact {
  name: String
  email: String
  phone: String
  status: String
  address: Address
  modifiedDate: DateTime
}

type PaymentAllocation {
  payment: PaymentRef!
  allocation: AllocationDetail!
}

type PaymentRef {
  id: ID
  reference: String
  accountRef: Reference
  currency: String
  currencyRate: Decimal
  paidOnDate: DateTime
  totalAmount: Decimal
  note: String
}

type AllocationDetail {
  currencyRate: Decimal
  allocatedOnDate: DateTime
  totalAmount: Decimal
}

type WithholdingTax {
  name: String!
  amount: Decimal!
}

# ─────────────────────────────────────────────
# Input Types
# ─────────────────────────────────────────────

input BillPaymentInput {
  supplierRef: ReferenceInput!
  accountRef: ReferenceInput!
  currency: String!
  currencyRate: Decimal
  date: DateTime!
  note: String
  lines: [BillPaymentLineInput!]!
  totalAmount: Decimal
  reference: String
}

input BillPaymentLineInput {
  amount: Decimal!
  links: [BillPaymentLineLinkInput!]
}

input BillPaymentLineLinkInput {
  type: String!
  id: ID
  amount: Decimal
  currencyRate: Decimal
}

input ExpenseInput {
  issueDate: Date!
  currency: String!
  currencyRate: Decimal
  type: String
  merchantName: String
  notes: String
  lines: [ExpenseLineInput!]!
}

input ExpenseLineInput {
  netAmount: Decimal!
  taxAmount: Decimal
  taxRateRef: ReferenceInput
  accountRef: ReferenceInput!
  trackingCategoryRefs: [ReferenceInput!]
}

input JournalEntryInput {
  description: String
  postedOn: DateTime
  journalRef: ReferenceInput
  journalLines: [JournalLineInput!]!
}

input JournalLineInput {
  description: String
  netAmount: Decimal!
  currency: String
  accountRef: ReferenceInput
  trackingCategoryRefs: [ReferenceInput!]
}

input BankFeedInput {
  accountName: String!
  accountType: String
  accountNumber: String
  sortCode: String
  currency: String!
  balance: Decimal
  feedStartDate: Date
}

input ReferenceInput {
  id: ID!
  name: String
}

# ─────────────────────────────────────────────
# Pagination
# ─────────────────────────────────────────────

type PageInfo {
  pageNumber: Int!
  pageSize: Int!
  totalResults: Int!
  hasMore: Boolean!
}

type CompanyConnection {
  results: [Company!]!
  pageInfo: PageInfo!
}

type IntegrationConnection {
  results: [Integration!]!
  pageInfo: PageInfo!
}

# ─────────────────────────────────────────────
# Root Types
# ─────────────────────────────────────────────

type Query {
  """Fetch a single company by ID."""
  company(id: ID!): Company

  """List all companies with pagination."""
  companies(page: Int, pageSize: Int, query: String): CompanyConnection!

  """Fetch a specific data connection for a company."""
  connection(companyId: ID!, connectionId: ID!): Connection

  """List all connections for a company."""
  connections(companyId: ID!): [Connection!]!

  """List available integrations."""
  integrations(page: Int, pageSize: Int, sourceType: String): IntegrationConnection!

  """Get the status of a pull operation."""
  pullOperation(companyId: ID!, datasetId: ID!): PullOperation

  """List pull operations for a company."""
  pullOperations(companyId: ID!, page: Int, pageSize: Int): [PullOperation!]!

  """Get sync status for all data types on a connection."""
  dataStatus(companyId: ID!, connectionId: ID!): [DataStatus!]!

  """List general ledger accounts."""
  accountingAccounts(companyId: ID!, connectionId: ID!): [AccountingAccount!]!

  """List account transactions."""
  accountTransactions(companyId: ID!, connectionId: ID!, accountId: ID!): [AccountTransaction!]!

  """List bills for a company."""
  bills(companyId: ID!, connectionId: ID!): [Bill!]!

  """Get a single bill."""
  bill(companyId: ID!, connectionId: ID!, billId: ID!): Bill

  """List bill credit notes."""
  billCreditNotes(companyId: ID!, connectionId: ID!): [BillCreditNote!]!

  """List bill payments."""
  billPayments(companyId: ID!, connectionId: ID!): [BillPayment!]!

  """List purchase orders."""
  purchaseOrders(companyId: ID!, connectionId: ID!): [PurchaseOrder!]!

  """List invoices for a company."""
  invoices(companyId: ID!, connectionId: ID!): [Invoice!]!

  """Get a single invoice."""
  invoice(companyId: ID!, connectionId: ID!, invoiceId: ID!): Invoice

  """List credit notes."""
  creditNotes(companyId: ID!, connectionId: ID!): [CreditNote!]!

  """List customer payments."""
  payments(companyId: ID!, connectionId: ID!): [Payment!]!

  """List sales orders."""
  salesOrders(companyId: ID!, connectionId: ID!): [SalesOrder!]!

  """List direct costs."""
  directCosts(companyId: ID!, connectionId: ID!): [DirectCost!]!

  """List direct income records."""
  directIncomes(companyId: ID!, connectionId: ID!): [DirectIncome!]!

  """List transfers."""
  transfers(companyId: ID!, connectionId: ID!): [Transfer!]!

  """List customers."""
  customers(companyId: ID!, connectionId: ID!): [Customer!]!

  """Get a single customer."""
  customer(companyId: ID!, connectionId: ID!, customerId: ID!): Customer

  """List suppliers."""
  suppliers(companyId: ID!, connectionId: ID!): [Supplier!]!

  """Get a single supplier."""
  supplier(companyId: ID!, connectionId: ID!, supplierId: ID!): Supplier

  """List items (products/services)."""
  items(companyId: ID!, connectionId: ID!): [Item!]!

  """List tax rates."""
  taxRates(companyId: ID!, connectionId: ID!): [TaxRate!]!

  """List tracking categories."""
  trackingCategories(companyId: ID!, connectionId: ID!): [TrackingCategory!]!

  """List journals."""
  journals(companyId: ID!, connectionId: ID!): [Journal!]!

  """List journal entries."""
  journalEntries(companyId: ID!, connectionId: ID!): [JournalEntry!]!

  """Fetch a balance sheet report."""
  balanceSheet(companyId: ID!, connectionId: ID!, date: Date!): BalanceSheet

  """Fetch a profit and loss report."""
  profitAndLoss(companyId: ID!, connectionId: ID!, periodLength: Int!, periodsToCompare: Int!): ProfitAndLoss

  """Fetch a cash flow statement."""
  cashFlow(companyId: ID!, connectionId: ID!, periodLength: Int!, periodsToCompare: Int!): CashFlow

  """List bank accounts."""
  bankAccounts(companyId: ID!, connectionId: ID!): [BankAccount!]!

  """List bank transactions for an account."""
  bankTransactions(companyId: ID!, connectionId: ID!, accountId: ID!): [BankTransaction!]!

  """List bank feed configurations."""
  bankFeeds(companyId: ID!, connectionId: ID!): [BankFeed!]!

  """List commerce customers."""
  commerceCustomers(companyId: ID!, connectionId: ID!): [CommerceCustomer!]!

  """List commerce orders."""
  orders(companyId: ID!, connectionId: ID!): [Order!]!

  """Get a single commerce order."""
  order(companyId: ID!, connectionId: ID!, orderId: ID!): Order

  """List commerce products."""
  products(companyId: ID!, connectionId: ID!): [Product!]!

  """List commerce locations."""
  locations(companyId: ID!, connectionId: ID!): [Location!]!

  """List payment disputes."""
  disputes(companyId: ID!, connectionId: ID!): [Dispute!]!

  """List commerce payments."""
  commercePayments(companyId: ID!, connectionId: ID!): [CommercePayment!]!

  """List expenses."""
  expenses(companyId: ID!, connectionId: ID!): [Expense!]!

  """Get financial profile for lending."""
  financialProfile(companyId: ID!): FinancialProfile

  """Get enhanced cash flow data."""
  enhancedCashFlow(companyId: ID!): EnhancedCashFlow

  """List webhooks."""
  webhooks: [Webhook!]!

  """List settings."""
  settings(companyId: ID!): [Setting!]!
}

type Mutation {
  """Register a new company in Codat."""
  createCompany(name: String!, description: String): Company!

  """Remove a company and all its data connections."""
  deleteCompany(id: ID!): Boolean!

  """Create a new data connection for a company."""
  createConnection(companyId: ID!, platformKey: String!): Connection!

  """Remove a data connection."""
  deleteConnection(companyId: ID!, connectionId: ID!): Boolean!

  """Trigger a data pull for a specific data type."""
  queuePullOperation(companyId: ID!, connectionId: ID!, dataType: String!): PullOperation!

  """Register a new webhook endpoint."""
  createWebhook(url: String!, type: String!, companyId: ID): Webhook!

  """Remove a webhook registration."""
  deleteWebhook(id: ID!): Boolean!

  """Post a bill payment to accounting software."""
  createBillPayment(companyId: ID!, connectionId: ID!, input: BillPaymentInput!): BillPayment!

  """Sync an expense record to accounting software."""
  createExpense(companyId: ID!, connectionId: ID!, input: ExpenseInput!): Expense!

  """Post a journal entry to accounting software."""
  createJournalEntry(companyId: ID!, connectionId: ID!, input: JournalEntryInput!): JournalEntry!

  """Configure a bank feed to push transactions to accounting software."""
  createBankFeed(companyId: ID!, connectionId: ID!, input: BankFeedInput!): BankFeed!
}
