}

"""A direct cost not associated with a bill."""
type DirectCost {
  id: ID!
  reference: String
  note: String
  contactRef: Reference
  issueDate: Date
  currency: String
  currencyRate: Decimal
  lineItems: [DirectCostLineItem!]!
  paymentAllocations: [PaymentAllocation!]!
  taxAmount: Decimal
  totalAmount: Decimal
  subTotal: Decimal
  modifiedDate: DateTime
  sourceModifiedDate: DateTime
}

type DirectCostLineItem {
  description: String
  unitAmount: Decimal
  quantity: Decimal
  discountAmount: Decimal
  subTotal: Decimal
  taxAmount: Decimal
  totalAmount: Decimal
  accountRef: Reference
  taxRateRef: Reference
  itemRef: Reference
  trackingCategoryRefs: [Reference!]
