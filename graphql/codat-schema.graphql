  depositedRecordRefs: [Reference!]
  modifiedDate: DateTime
  sourceModifiedDate: DateTime
}

type TransferAccount {
  accountRef: Reference
  currency: String
  amount: Decimal
}

# ─────────────────────────────────────────────
# Accounting — Master Data Types
# ─────────────────────────────────────────────

"""A person or organization that purchases from the company."""
type Customer {
  id: ID!
  customerName: String
  contactName: String
  emailAddress: String
  phone: String
  addresses: [Address!]
  contacts: [Contact!]
  registrationNumber: String
  taxNumber: String
  status: String
  currency: String
  defaultCurrency: String
  modifiedDate: DateTime
  sourceModifiedDate: DateTime
}

"""A person or organization providing goods or services to the company."""
type Supplier {
  id: ID!
  supplierName: String
  contactName: String
  emailAddress: String
  phone: String
  addresses: [Address!]
  registrationNumber: String
  taxNumber: String
  status: String
  defaultCurrency: String
  modifiedDate: DateTime
  sourceModifiedDate: DateTime
}

"""A product or service that can appear on invoices or bills."""
type Item {
  id: ID!
  name: String
  code: String
  itemStatus: String
  type: String
  isBillItem: Boolean
  isInvoiceItem: Boolean
  billItem: ItemDetails
  invoiceItem: ItemDetails
  modifiedDate: DateTime
  sourceModifiedDate: DateTime
}

type ItemDetails {
  description: String
  unitPrice: Decimal
  accountRef: Reference
  taxRateRef: Reference
}

"""A tax code and rate used in accounting transactions."""
type TaxRate {
  id: ID!
  name: String!
  code: String
  effectiveTaxRate: Decimal
  totalTaxRate: Decimal
  components: [TaxRateComponent!]
  status: String
  validDatatypeLinks: [ValidDatatypeLink!]
  modifiedDate: DateTime
  sourceModifiedDate: DateTime
}

type TaxRateComponent {
  name: String
  rate: Decimal
  isCompound: Boolean
}

"""A dimension for categorizing transactions for reporting."""
type TrackingCategory {
  id: ID!
  name: String!
  status: String
  parentId: ID
  modifiedDate: DateTime
  sourceModifiedDate: DateTime
}

# ─────────────────────────────────────────────
# Accounting — Journals
# ─────────────────────────────────────────────

"""A named journal used to group journal entries."""
type Journal {
  id: ID!
  name: String
  journalCode: String
  type: String
  parentId: ID
  status: String
  createdOn: DateTime
  modifiedDate: DateTime
  sourceModifiedDate: DateTime
}

"""A double-entry bookkeeping record."""
type JournalEntry {
  id: ID!
  description: String
  postedOn: DateTime
  createdOn: DateTime
  updatedOn: DateTime
  journalRef: Reference
  journalLines: [JournalLine!]!
  recordRef: Reference
  modifiedDate: DateTime
  sourceModifiedDate: DateTime
}

type JournalLine {
  description: String
  netAmount: Decimal!
  currency: String
  accountRef: Reference
  trackingCategoryRefs: [Reference!]
  tracking: TrackingRef
}

type TrackingRef {
  recordRefs: [Reference!]
  invoiceTo: Reference
}

# ─────────────────────────────────────────────
# Accounting — Reports
# ─────────────────────────────────────────────

"""A monetary value with currency and period context."""
type Balance {
  value: Decimal!
  currency: String
  date: Date
}

"""A balance sheet financial statement."""
type BalanceSheet {
  currency: String!
  date: Date!
  netAssets: Decimal
  assets: ReportSection
  liabilities: ReportSection
  equity: ReportSection
}

"""A profit and loss financial statement."""
type ProfitAndLoss {
  currency: String!
  fromDate: Date!
  toDate: Date!
  income: ReportSection
  costOfSales: ReportSection
  grossProfit: Decimal
  otherExpenses: ReportSection
  otherIncome: ReportSection
  netOtherIncome: Decimal
  expenses: ReportSection
  netProfit: Decimal
}

"""A cash flow statement."""
type CashFlow {
  currency: String!
  fromDate: Date!
  toDate: Date!
  operating: ReportSection
  investing: ReportSection
  financing: ReportSection
  netCashMovement: Decimal
  cashAtBeginningOfPeriod: Decimal
  cashAtEndOfPeriod: Decimal
}

type ReportSection {
  name: String
  value: Decimal
  items: [ReportItem!]
}

type ReportItem {
  name: String
  value: Decimal
  items: [ReportItem!]
}

"""A generic financial report wrapper."""
type Report {
  id: ID!
  type: String!
  title: String
  generatedDate: DateTime
  currency: String
  data: JSON
}

