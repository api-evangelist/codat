naftiko: 1.0.0-alpha2
info:
  label: Lending — Manage reports
  description: 'Lending — Manage reports. 3 operations. Lead operation: List reports. Self-contained Naftiko capability covering
    one Codat business surface.'
  tags:
  - Codat
  - Manage reports
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CODAT_API_KEY: CODAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: lending-manage-reports
    baseUri: https://api.codat.io
    description: Lending — Manage reports business capability. Self-contained, no shared references.
    resources:
    - name: companies-companyId-reports
      path: /companies/{companyId}/reports
      operations:
      - name: listreports
        method: GET
        description: List reports
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: companies-companyId-reports-reportType
      path: /companies/{companyId}/reports/{reportType}
      operations:
      - name: generatereport
        method: POST
        description: Generate report
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: companies-companyId-reports-reportType-reportId-status
      path: /companies/{companyId}/reports/{reportType}/{reportId}/status
      operations:
      - name: getreportstatus
        method: GET
        description: Get report status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.CODAT_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: lending-manage-reports-rest
    port: 8080
    description: REST adapter for Lending — Manage reports. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/companies/{companyid}/reports
      name: companies-companyid-reports
      description: REST surface for companies-companyId-reports.
      operations:
      - method: GET
        name: listreports
        description: List reports
        call: lending-manage-reports.listreports
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/companies/{companyid}/reports/{reporttype}
      name: companies-companyid-reports-reporttype
      description: REST surface for companies-companyId-reports-reportType.
      operations:
      - method: POST
        name: generatereport
        description: Generate report
        call: lending-manage-reports.generatereport
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/companies/{companyid}/reports/{reporttype}/{reportid}/status
      name: companies-companyid-reports-reporttype-reportid-status
      description: REST surface for companies-companyId-reports-reportType-reportId-status.
      operations:
      - method: GET
        name: getreportstatus
        description: Get report status
        call: lending-manage-reports.getreportstatus
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: lending-manage-reports-mcp
    port: 9090
    transport: http
    description: MCP adapter for Lending — Manage reports. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-reports
      description: List reports
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: lending-manage-reports.listreports
      outputParameters:
      - type: object
        mapping: $.
    - name: generate-report
      description: Generate report
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: lending-manage-reports.generatereport
      outputParameters:
      - type: object
        mapping: $.
    - name: get-report-status
      description: Get report status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: lending-manage-reports.getreportstatus
      outputParameters:
      - type: object
        mapping: $.
