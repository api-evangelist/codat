naftiko: 1.0.0-alpha2
info:
  label: Platform API — Refresh data
  description: 'Platform API — Refresh data. 5 operations. Lead operation: Refresh all data. Self-contained Naftiko capability
    covering one Codat business surface.'
  tags:
  - Codat
  - Refresh data
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CODAT_API_KEY: CODAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-refresh-data
    baseUri: https://api.codat.io
    description: Platform API — Refresh data business capability. Self-contained, no shared references.
    resources:
    - name: companies-companyId-data-all
      path: /companies/{companyId}/data/all
      operations:
      - name: refreshcompanydata
        method: POST
        description: Refresh all data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: companies-companyId-data-history
      path: /companies/{companyId}/data/history
      operations:
      - name: listpulloperations
        method: GET
        description: List pull operations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: companies-companyId-data-history-datasetId
      path: /companies/{companyId}/data/history/{datasetId}
      operations:
      - name: getpulloperation
        method: GET
        description: Get pull operation
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: companies-companyId-data-queue-dataType
      path: /companies/{companyId}/data/queue/{dataType}
      operations:
      - name: refreshdatatype
        method: POST
        description: Refresh data type
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: connectionId
          in: query
          type: string
          description: Optionally, provide a data connection id to only queue pull operations on that connection.
    - name: companies-companyId-dataStatus
      path: /companies/{companyId}/dataStatus
      operations:
      - name: getcompanydatastatus
        method: GET
        description: Get data status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.CODAT_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: platform-refresh-data-rest
    port: 8080
    description: REST adapter for Platform API — Refresh data. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/companies/{companyid}/data/all
      name: companies-companyid-data-all
      description: REST surface for companies-companyId-data-all.
      operations:
      - method: POST
        name: refreshcompanydata
        description: Refresh all data
        call: platform-refresh-data.refreshcompanydata
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/companies/{companyid}/data/history
      name: companies-companyid-data-history
      description: REST surface for companies-companyId-data-history.
      operations:
      - method: GET
        name: listpulloperations
        description: List pull operations
        call: platform-refresh-data.listpulloperations
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/companies/{companyid}/data/history/{datasetid}
      name: companies-companyid-data-history-datasetid
      description: REST surface for companies-companyId-data-history-datasetId.
      operations:
      - method: GET
        name: getpulloperation
        description: Get pull operation
        call: platform-refresh-data.getpulloperation
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/companies/{companyid}/data/queue/{datatype}
      name: companies-companyid-data-queue-datatype
      description: REST surface for companies-companyId-data-queue-dataType.
      operations:
      - method: POST
        name: refreshdatatype
        description: Refresh data type
        call: platform-refresh-data.refreshdatatype
        with:
          connectionId: rest.connectionId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/companies/{companyid}/datastatus
      name: companies-companyid-datastatus
      description: REST surface for companies-companyId-dataStatus.
      operations:
      - method: GET
        name: getcompanydatastatus
        description: Get data status
        call: platform-refresh-data.getcompanydatastatus
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-refresh-data-mcp
    port: 9090
    transport: http
    description: MCP adapter for Platform API — Refresh data. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: refresh-all-data
      description: Refresh all data
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: platform-refresh-data.refreshcompanydata
      outputParameters:
      - type: object
        mapping: $.
    - name: list-pull-operations
      description: List pull operations
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-refresh-data.listpulloperations
      outputParameters:
      - type: object
        mapping: $.
    - name: get-pull-operation
      description: Get pull operation
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-refresh-data.getpulloperation
      outputParameters:
      - type: object
        mapping: $.
    - name: refresh-data-type
      description: Refresh data type
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: platform-refresh-data.refreshdatatype
      with:
        connectionId: tools.connectionId
      outputParameters:
      - type: object
        mapping: $.
    - name: get-data-status
      description: Get data status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-refresh-data.getcompanydatastatus
      outputParameters:
      - type: object
        mapping: $.
