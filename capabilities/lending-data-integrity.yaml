      outputParameters:
      - type: object
        mapping: $.
    - name: get-data-integrity-summaries
      description: Get data integrity summaries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: lending-data-integrity.getdataintegritysummaries
      outputParameters:
      - type: object
        mapping: $.
