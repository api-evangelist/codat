        - type: object
          mapping: $.
    - path: /v1/data/companies/{companyid}/assess/datatypes/{datatype}/dataintegrity/summaries
      name: data-companies-companyid-assess-datatypes-datatype-dataintegrity-summaries
      description: REST surface for data-companies-companyId-assess-dataTypes-dataType-dataIntegrity-summaries.
      operations:
      - method: GET
        name: getdataintegritysummaries
        description: Get data integrity summaries
        call: lending-data-integrity.getdataintegritysummaries
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: lending-data-integrity-mcp
    port: 9090
    transport: http
    description: MCP adapter for Lending — Data integrity. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: list-data-integrity-details
      description: List data integrity details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: lending-data-integrity.listdataintegritydetails
