naftiko: 1.0.0-alpha2
info:
  label: Platform API — Settings
  description: 'Platform API — Settings. 11 operations. Lead operation: List API keys. Self-contained Naftiko capability covering
    one Codat business surface.'
  tags:
  - Codat
  - Settings
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CODAT_API_KEY: CODAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-settings
    baseUri: https://api.codat.io
    description: Platform API — Settings business capability. Self-contained, no shared references.
    resources:
    - name: apiKeys
      path: /apiKeys
      operations:
      - name: listapikeys
        method: GET
        description: List API keys
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createapikey
        method: POST
        description: Create API key
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: apiKeys-apiKeyId
      path: /apiKeys/{apiKeyId}
      operations:
      - name: deleteapikey
        method: DELETE
        description: Delete API key
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: apiKeyId
          in: path
          type: string
          description: Unique identifier for api key.
          required: true
    - name: connectionManagement-corsSettings
      path: /connectionManagement/corsSettings
      operations:
      - name: getconnectionmanagementcorssettings
        method: GET
        description: Get CORS settings (old)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: setconnectionmanagementcorssettings
        method: POST
        description: Set CORS settings (old)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: corsSettings
      path: /corsSettings
      operations:
      - name: getcorssettings
        method: GET
        description: Get CORS settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: setcorssettings
        method: POST
        description: Set CORS settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: profile
      path: /profile
      operations:
      - name: getprofile
        method: GET
        description: Get profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateprofile
        method: PUT
        description: Update profile
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: profile-syncSettings
      path: /profile/syncSettings
      operations:
      - name: getprofilesyncsettings
        method: GET
        description: Get sync settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateprofilesyncsettings
        method: POST
        description: Update all sync settings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.CODAT_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: platform-settings-rest
    port: 8080
    description: REST adapter for Platform API — Settings. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/apikeys
      name: apikeys
      description: REST surface for apiKeys.
      operations:
      - method: GET
        name: listapikeys
        description: List API keys
        call: platform-settings.listapikeys
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createapikey
        description: Create API key
        call: platform-settings.createapikey
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/apikeys/{apikeyid}
      name: apikeys-apikeyid
      description: REST surface for apiKeys-apiKeyId.
      operations:
      - method: DELETE
        name: deleteapikey
        description: Delete API key
        call: platform-settings.deleteapikey
        with:
          apiKeyId: rest.apiKeyId
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/connectionmanagement/corssettings
