naftiko: 1.0.0-alpha2
info:
  label: Bank Feeds — Account mapping
  description: 'Bank Feeds — Account mapping. 2 operations. Lead operation: List bank feed accounts. Self-contained Naftiko
    capability covering one Codat business surface.'
  tags:
  - Codat
  - Account mapping
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CODAT_API_KEY: CODAT_API_KEY
capability:
  consumes:
  - type: http
    namespace: bank-feeds-account-mapping
    baseUri: https://api.codat.io
    description: Bank Feeds — Account mapping business capability. Self-contained, no shared references.
    resources:
    - name: companies-companyId-connections-connectionId-bankFeedAccounts-mapping
      path: /companies/{companyId}/connections/{connectionId}/bankFeedAccounts/mapping
      operations:
      - name: getbankaccountmapping
        method: GET
        description: List bank feed accounts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: createbankaccountmapping
        method: POST
        description: Create bank feed account mapping
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.CODAT_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: bank-feeds-account-mapping-rest
    port: 8080
    description: REST adapter for Bank Feeds — Account mapping. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/companies/{companyid}/connections/{connectionid}/bankfeedaccounts/mapping
      name: companies-companyid-connections-connectionid-bankfeedaccounts-mapping
      description: REST surface for companies-companyId-connections-connectionId-bankFeedAccounts-mapping.
      operations:
      - method: GET
        name: getbankaccountmapping
        description: List bank feed accounts
        call: bank-feeds-account-mapping.getbankaccountmapping
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createbankaccountmapping
        description: Create bank feed account mapping
        call: bank-feeds-account-mapping.createbankaccountmapping
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: bank-feeds-account-mapping-mcp
    port: 9090
    transport: http
    description: MCP adapter for Bank Feeds — Account mapping. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-bank-feed-accounts
      description: List bank feed accounts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: bank-feeds-account-mapping.getbankaccountmapping
      outputParameters:
      - type: object
        mapping: $.
    - name: create-bank-feed-account-mapping
      description: Create bank feed account mapping
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: bank-feeds-account-mapping.createbankaccountmapping
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
